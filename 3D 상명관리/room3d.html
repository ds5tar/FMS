<!doctype html>
<!-- 전산실 3D 상면 화면 — 폐쇄망용 Three.js 사본(vendor/three)으로 랙·항온항습기를 세우고 시점을 쉽게 고르게 한다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전산실 3D 상면</title>
<style>
  :root{ --ink:#1c2126; --sub:#5b6672; --line:#d3d8de; --panel:#ffffffee; --brand:#009bde; }
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;
    font:13px/1.55 "Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--ink)}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.over{cursor:pointer}
  #cv.drag{cursor:grabbing}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:12px 14px;box-shadow:0 3px 18px #0001}
  #ui{top:14px;left:14px;width:226px}
  #info{bottom:14px;left:14px;min-width:226px;max-width:300px}
  #map{bottom:14px;right:14px;padding:9px 10px 8px}
  #ui h1{margin:0 0 2px;font-size:14px}
  .sub{color:var(--sub);font-size:11.5px}
  #ui .sub{margin-bottom:9px}
  #ui label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
  #ui hr{border:0;border-top:1px solid var(--line);margin:9px 0}
  .sw{width:12px;height:12px;border-radius:2px;border:1px solid #0003}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;padding:3px 9px;border:1px solid var(--line);
    background:#fff;border-radius:6px;cursor:pointer}
  button:hover{background:#f3f5f7}
  #find{font:inherit;width:100%;box-sizing:border-box;padding:4px 8px;
    border:1px solid var(--line);border-radius:6px;margin-top:9px}
  #info b{font-size:13px}
  #info .k{color:var(--sub);display:inline-block;min-width:52px}
  #map .t{font-weight:600;font-size:12px;margin-bottom:5px}
  #map .t span{font-weight:400;color:var(--sub);font-size:11px}
  #mini{display:block;cursor:crosshair;border:1px solid var(--line);border-radius:5px;
    background:#fff;touch-action:none}
  #help{color:var(--sub);font-size:11px;line-height:1.6;margin-top:6px}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js",
            "three/addons/":"./vendor/three/addons/"}}
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui" class="panel">
  <h1>전산실 3D 상면</h1>
  <div class="sub">평면도에서 뽑은 좌표 · 바닥타일 600 mm</div>
  <label><input type="checkbox" id="t_rack" checked><span class="sw" style="background:#4b525c"></span>랙 <span id="n_rack"></span></label>
  <label><input type="checkbox" id="t_ac" checked><span class="sw" style="background:#e9ecef"></span>항온항습기 <span id="n_ac"></span></label>
  <label><input type="checkbox" id="t_col" checked><span class="sw" style="background:#23262b"></span>기둥 <span id="n_col"></span></label>
  <label><input type="checkbox" id="t_wall" checked><span class="sw" style="background:#f2f3f5"></span>벽</label>
  <label><input type="checkbox" id="t_floor" checked><span class="sw" style="background:#e7e9eb"></span>바닥 · 타일선</label>
  <hr>
  <div class="row">
    <button id="v_iso">비스듬히</button>
    <button id="v_top">위에서</button>
    <button id="v_eye">통로에서</button>
  </div>
  <label style="margin-top:7px"><input type="checkbox" id="t_wallhi">벽을 전체 높이로 (3.6 m)</label>
  <input id="find" placeholder="찾기 — 랙 R123 · 열 C1 · AC05" autocomplete="off">
</div>

<div id="info" class="panel"><b>객체를 누르면 정보가 나옵니다</b></div>

<div id="map" class="panel">
  <div class="t">평면에서 위치 고르기 <span>누르거나 끌면 그곳을 봅니다</span></div>
  <canvas id="mini"></canvas>
  <div id="help">왼쪽 끌기 = 회전 · 오른쪽(가운데·Shift) 끌기 = 이동<br>
    휠 = 마우스가 있는 쪽으로 확대 · 두 번 누르기 = 그 자리로 가기<br>
    방향키·WASD = 이동 · Q/E = 회전 · +/− = 확대 · F = 고른 것 · Home = 전체</div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);

function 알림(제목, 글) {
  const el = $("info");
  el.replaceChildren();
  const b = document.createElement("b"); b.textContent = 제목; el.append(b);
  if (글) { const d = document.createElement("div"); d.className = "sub"; d.textContent = 글; el.append(d); }
}

/* ── 장면 자료 ─────────────────────────────────────────────────────
   rack [id, 열, x, y, w, d, h] · ac·col [id, x, y, w, d, h]
   wall [x, y, w, d, h] · floor [x, y, w, d]          단위는 전부 m
   평면 좌표 (x 오른쪽, y 아래, z 위) 를 Three.js 의 (x, z, y) 로 옮긴다. */
let S;
try {
  const r = await fetch("room3d_scene.json", {cache: "no-cache"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  S = await r.json();
} catch (e) {
  알림("장면 자료를 읽지 못했습니다", "room3d_scene.json (" + e.message + ")");
  throw e;
}
const 방 = {w: S.room[0], d: S.room[1]};
const V = (x, y, z) => new THREE.Vector3(x, z, y);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas: $("cv"), antialias: true});
} catch (e) {
  알림("이 브라우저에서 3D 를 그릴 수 없습니다", "크롬이나 엣지 최신판으로 열어 주세요.");
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // r185 에서 PCFSoft 는 없어졌다

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.14;
controls.zoomToCursor = true;            // 휠은 화면 가운데가 아니라 마우스 쪽으로 다가간다
controls.screenSpacePanning = false;     // 이동은 바닥을 따라 (높이가 안 변한다)
controls.maxPolarAngle = THREE.MathUtils.degToRad(88);
controls.minDistance = 1.2;
controls.maxDistance = 160;
controls.mouseButtons = {LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN};

/* ── 빛 ─────────────────────────────────────────────────────────── */
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9dee4, 2.0));
const 해 = new THREE.DirectionalLight(0xffffff, 1.5);
해.position.copy(V(방.w * 0.25, -방.d * 0.35, 30));
해.target.position.copy(V(방.w / 2, 방.d / 2, 0));
해.castShadow = true;
해.shadow.mapSize.set(2048, 2048);
Object.assign(해.shadow.camera, {left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 90});
해.shadow.bias = -0.0005;
scene.add(해, 해.target);

/* ── 상자 묶음 — 종류마다 InstancedMesh 하나 (그리기 호출이 적다) ───── */
const 재질정보 = {
  rack : {rgb: 0x4a515c, 이름: "랙"},
  ac   : {rgb: 0xf2f4f7, 이름: "항온항습기"},
  col  : {rgb: 0x262a30, 이름: "기둥"},
  wall : {rgb: 0xf9fafb, 이름: "벽"},
  floor: {rgb: 0xe8eaec, 이름: "바닥"},
};
const 고름색 = new THREE.Color(0xd97706), 위색 = new THREE.Color(0xf59e0b);

/* 랙 옆면 — 문틀과 U 단을 옅게 그린 그림을 씌운다. 밋밋한 상자와 랙을 눈으로 가른다. */
function 랙옆그림() {
  const c = document.createElement("canvas"); c.width = 64; c.height = 192;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, 64, 192);
  g.strokeStyle = "rgba(0,0,0,.28)"; g.lineWidth = 2;
  g.strokeRect(5, 5, 54, 182);
  g.lineWidth = 1;
  for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(5, 5 + i * 182 / 6); g.lineTo(59, 5 + i * 182 / 6); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function 묶음(종류, 목록, 그림자 = true) {
  const 기본 = new THREE.Color(재질정보[종류].rgb);
  let mat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.85, metalness: 0});
  if (종류 === "rack") {
    const 옆 = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.8, map: 랙옆그림()});
    mat = [옆, 옆, mat, mat, 옆, 옆];          // +x −x +y(윗면) −y +z −z
  }
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, 목록.length);
  mesh.userData = {종류, 목록, 기본};
  목록.forEach((b, i) => { mesh.setColorAt(i, 기본); });
  mesh.castShadow = 그림자; mesh.receiveShadow = true;
  자리놓기(mesh);
  scene.add(mesh);
  return mesh;
}
function 자리놓기(mesh) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  mesh.userData.목록.forEach((b, i) => {
    m.compose(V(b.x + b.w / 2, b.y + b.d / 2, b.z0 + b.h / 2), q, new THREE.Vector3(b.w, b.h, b.d));
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  mesh.computeBoundingBox(); mesh.computeBoundingSphere();
}

const 상자 = (id, 이름, x, y, w, d, z0, h) => ({id, 이름, x, y, w, d, z0, h});
const 랙목록 = S.rack.map(r => 상자(r[0], "열 " + r[1], r[2], r[3], r[4], r[5], 0, r[6]));
랙목록.forEach((b, i) => b.열 = S.rack[i][1]);
const 묶 = {
  rack : 묶음("rack", 랙목록),
  ac   : 묶음("ac",  S.ac .map(r => 상자(r[0], "항온항습기", r[1], r[2], r[3], r[4], 0, r[5]))),
  col  : 묶음("col", S.col.map(r => 상자(r[0], "구조 기둥",  r[1], r[2], r[3], r[4], 0, r[5]))),
  /* 벽은 기본으로 허리 높이(1.2 m)로 자른다 — 3.6 m 로 세우면 칸막이벽이 랙을 통째로 가린다. */
  wall : 묶음("wall", S.wall.map(r => 상자("", "벽", r[0], r[1], r[2], r[3], 0, 1.2))),
  floor: 묶음("floor", S.floor.map(r => 상자("", "바닥", r[0], r[1], r[2], r[3], -0.15, 0.15)), false),
};
$("n_rack").textContent = S.rack.length + "대";
$("n_ac").textContent = S.ac.length + "대";
$("n_col").textContent = S.col.length + "개";

/* 600 mm 타일선 — 바닥 조각 안에서만 긋는다 */
const 타일 = (() => {
  const p = [];
  for (const r of S.floor) {
    const [x, y, w, d] = r;
    for (let t = x + 0.6; t < x + w - 1e-6; t += 0.6) p.push(t, 0.003, y, t, 0.003, y + d);
    for (let t = y + 0.6; t < y + d - 1e-6; t += 0.6) p.push(x, 0.003, t, x + w, 0.003, t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color: 0x465262, transparent: true, opacity: 0.16}));
  scene.add(l); return l;
})();

/* 열 이름표 — 랙 열 위에 띄워 어디를 보고 있는지 바로 알게 한다 */
const 열들 = new Map();
랙목록.forEach((b, i) => {
  const e = 열들.get(b.열) || {이름: b.열, x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9, 번호: []};
  e.x0 = Math.min(e.x0, b.x); e.y0 = Math.min(e.y0, b.y);
  e.x1 = Math.max(e.x1, b.x + b.w); e.y1 = Math.max(e.y1, b.y + b.d);
  e.번호.push(i); 열들.set(b.열, e);
});
const 이름표 = [];
for (const e of 열들.values()) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(255,255,255,.92)"; g.strokeStyle = "rgba(28,33,38,.35)"; g.lineWidth = 3;
  g.beginPath(); g.roundRect(4, 4, 120, 56, 12); g.fill(); g.stroke();
  g.fillStyle = "#1c2126"; g.font = "bold 36px 'Malgun Gothic', sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e.이름, 64, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: t, depthTest: false}));
  /* 두 줄짜리 열(B1·B2)은 이름표가 겹치므로 열의 위 끝 쪽에 엇갈려 단다 */
  const 짝 = e.이름.endsWith("2") ? 1 : -1;
  s.position.copy(V((e.x0 + e.x1) / 2, 짝 < 0 ? e.y0 - 0.5 : e.y1 + 0.5, 2.4));
  s.scale.set(1.1, 0.55, 1);
  s.renderOrder = 10;
  scene.add(s); 이름표.push(s);
}

/* ── 고르기 ──────────────────────────────────────────────────────── */
const 광선 = new THREE.Raycaster();
const 바닥면 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function 화면좌표(e, el = renderer.domElement) {
  const r = el.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function 집기(ndc) {
  광선.setFromCamera(ndc, camera);
  const 대상 = [묶.rack, 묶.ac, 묶.col].filter(m => m.visible);
  const h = 광선.intersectObjects(대상, false)[0];
  return h ? {mesh: h.object, i: h.instanceId, 점: h.point} : null;
}
function 바닥점(ndc) {
  광선.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return 광선.ray.intersectPlane(바닥면, p) ? p : null;
}

let 고른 = [], 위에 = null;
function 칠하기() {
  for (const m of [묶.rack, 묶.ac, 묶.col]) {
    m.userData.목록.forEach((_, i) => m.setColorAt(i, m.userData.기본));
  }
  if (위에) 위에.mesh.setColorAt(위에.i, 위색);
  for (const k of 고른) k.mesh.setColorAt(k.i, 고름색);
  for (const m of [묶.rack, 묶.ac, 묶.col]) m.instanceColor.needsUpdate = true;
  더러움 = true;
}
const 같은것 = (a, b) => a && b && a.mesh === b.mesh && a.i === b.i;

function 정보() {
  const el = $("info");
  el.replaceChildren();
  if (!고른.length) { 알림("객체를 누르면 정보가 나옵니다", "두 번 누르면 그 자리로 갑니다."); return; }
  const 줄 = (k, v) => {
    const d = document.createElement("div");
    const s = document.createElement("span"); s.className = "k"; s.textContent = k;
    d.append(s, document.createTextNode(v)); el.append(d);
  };
  const b0 = document.createElement("b");
  if (고른.length > 1) {
    const 첫 = 고른[0].mesh.userData.목록[고른[0].i], 끝 = 고른[고른.length - 1].mesh.userData.목록[고른[고른.length - 1].i];
    b0.textContent = "열 " + 첫.열; el.append(b0);
    줄("랙", `${고른.length}대 (${첫.id} ~ ${끝.id})`);
  } else {
    const {mesh, i} = 고른[0], b = mesh.userData.목록[i];
    b0.textContent = b.id + " "; el.append(b0);
    const s = document.createElement("span"); s.className = "sub"; s.textContent = 재질정보[mesh.userData.종류].이름;
    b0.after(s);
    if (b.이름) 줄("구분", b.이름);
    줄("위치", `X ${b.x.toFixed(2)} m · Y ${b.y.toFixed(2)} m`);
    줄("크기", `${b.w.toFixed(2)} × ${b.d.toFixed(2)} × ${b.h.toFixed(2)} m`);
  }
  const d = document.createElement("div"); d.className = "sub"; d.style.marginTop = "4px";
  d.textContent = "F 를 누르면 가까이 갑니다."; el.append(d);
}

/* ── 시점 옮기기 ──────────────────────────────────────────────────
   목표점과 카메라를 함께 옮긴다. 방향은 두고, 거리만 바꾸거나 둔다. */
let 비행 = null, 더러움 = true;
function 날기(목표, 거리 = null, 방향 = null, ms = 450) {
  const 시작 = {t: performance.now(), 목표: controls.target.clone(), 차: camera.position.clone().sub(controls.target)};
  const 끝차 = (방향 ? 방향.clone().normalize() : 시작.차.clone().normalize())
    .multiplyScalar(거리 ?? 시작.차.length());
  비행 = {시작, 끝목표: 목표.clone(), 끝차, ms};
}
function 비행진행(now) {
  if (!비행) return false;
  const {시작, 끝목표, 끝차, ms} = 비행;
  const t = Math.min(1, (now - 시작.t) / ms), e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  controls.target.lerpVectors(시작.목표, 끝목표, e);
  const 길이 = THREE.MathUtils.lerp(시작.차.length(), 끝차.length(), e);
  const 차 = 시작.차.clone().normalize().lerp(끝차.clone().normalize(), e).normalize().multiplyScalar(길이);
  camera.position.copy(controls.target).add(차);
  if (t >= 1) 비행 = null;
  return true;
}
const 지금거리 = () => camera.position.distanceTo(controls.target);
function 옮기기(d) { controls.target.add(d); camera.position.add(d); 더러움 = true; }
function 앞오른쪽() {
  const 앞 = controls.target.clone().sub(camera.position); 앞.y = 0;
  /* 바로 위에서 내려다보면 앞이 0 이 된다 — 화면 위쪽 방향을 앞으로 쓴다 */
  if (앞.lengthSq() < 1e-6) 앞.copy(camera.up).applyQuaternion(camera.quaternion).setY(0);
  if (앞.lengthSq() < 1e-6) 앞.set(0, 0, -1);
  앞.normalize();
  return {앞, 오른: new THREE.Vector3().crossVectors(앞, new THREE.Vector3(0, 1, 0))};
}
function 확대(배) {
  const 차 = camera.position.clone().sub(controls.target);
  차.setLength(THREE.MathUtils.clamp(차.length() * 배, controls.minDistance, controls.maxDistance));
  camera.position.copy(controls.target).add(차); 더러움 = true;
}
function 돌리기(각) {
  const 차 = camera.position.clone().sub(controls.target).applyAxisAngle(new THREE.Vector3(0, 1, 0), 각);
  camera.position.copy(controls.target).add(차); 더러움 = true;
}
/* 방위(az)·올려본 각(el) → 카메라 방향. az 0 이면 평면 아래쪽(+y)에서 위를 본다. */
const 방향 = (az, el) => new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
